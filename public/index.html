<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MissedCall Rescue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .header-logo {
            display: block;
            width: 260px;
            max-width: 100%;
            height: auto;
            margin-bottom: 6px;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 30px;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            color: #cbd5e1;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .dashboard-heading h2 {
            margin: 0;
            font-size: 22px;
        }

        #enquiry-count {
            background: #e5e7eb;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters button {
            border: 1px solid #d1d5db;
            background: white;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .filters button:hover {
            background: #f3f4f6;
        }

        .filters button.active {
            background: #111827;
            color: white;
            border-color: #111827;
        }

        .enquiry-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .enquiry-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 14px;
        }

        .caller {
            font-weight: bold;
            font-size: 17px;
        }

        .status {
            display: inline-block;
            margin-left: 10px;
            padding: 4px 9px;
            border-radius: 12px;
            background: #dbeafe;
            color: #1e40af;
            font-size: 12px;
            font-weight: bold;
        }

        .received {
            color: #6b7280;
            font-size: 13px;
            white-space: nowrap;
        }

        .original-message {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 7px;
            padding: 14px;
            margin-bottom: 18px;
        }

        .original-message-label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .message {
            margin: 0;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 13px;
            font-weight: bold;
            color: #4b5563;
        }

        .field input,
        .field textarea,
        .status-actions select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 9px 10px;
            font-family: inherit;
            font-size: 14px;
            background: white;
        }

        .field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #e5e7eb;
            padding-top: 14px;
            margin-top: 16px;
        }

        .status-actions {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
        }

        .status-actions select {
            width: auto;
            padding: 7px 9px;
        }

        .save-button {
            border: 0;
            background: #111827;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-button:hover {
            background: #374151;
        }

        .save-button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .call-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: white;
            border: 0;
            padding: 9px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-family: inherit;
            font-size: 13px;
            line-height: normal;
            font-weight: bold;
            cursor: pointer;
        }

        .call-button:hover {
            background: #374151;
        }

        .copy-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: white;
            border: 0;
            padding: 9px 16px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 13px;
            line-height: normal;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-button:hover {
            background: #374151;
        }

        .save-result {
            margin-right: auto;
            font-size: 13px;
            color: #047857;
        }

        .empty,
        .error {
            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            header {
                padding: 18px 20px;
            }

            .enquiry-header {
                display: block;
            }

            .received {
                display: block;
                margin-top: 6px;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .card-footer {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <img
                src="/missedcall-rescue-logo.png"
                alt="MissedCall Rescue"
                class="header-logo"
        >
            <p>Enquiry Dashboard</p>
        </div>
    </header>

    <main>

        <div class="dashboard-heading">
            <h2>Enquiries</h2>
            <span id="enquiry-count">Loading...</span>
        </div>

        <div class="filters">
            <button data-filter="All" onclick="setFilter('All')">All</button>
            <button data-filter="New" onclick="setFilter('New')">New</button>
            <button data-filter="In Progress" onclick="setFilter('In Progress')">In Progress</button>
            <button data-filter="Completed" onclick="setFilter('Completed')">Completed</button>
        </div>

        <div id="enquiries">
            <div class="empty">Loading enquiries...</div>
        </div>

    </main>

    <script>
        let currentFilter = "All";
        let allEnquiries = [];

        async function loadEnquiries() {
            const container = document.getElementById("enquiries");
            const count = document.getElementById("enquiry-count");

            try {
                const response = await fetch("/api/enquiries");

                if (!response.ok) {
                    throw new Error("Unable to retrieve enquiries");
                }

                allEnquiries = await response.json();

                setFilter(currentFilter);

            } catch (error) {
                count.textContent = "Error";
                container.innerHTML =
                    '<div class="error">Unable to load enquiries.</div>';
            }
        }

        function renderEnquiries(enquiries) {
            const container = document.getElementById("enquiries");
            const count = document.getElementById("enquiry-count");

            count.textContent =
                `${enquiries.length} ${enquiries.length === 1 ? "enquiry" : "enquiries"}`;

            if (enquiries.length === 0) {
                container.innerHTML =
                    '<div class="empty">No enquiries in this view.</div>';
                return;
            }

            container.innerHTML = enquiries.map(enquiry => {
                const status = enquiry.status || "New";

                return `
                    <article class="enquiry-card" id="enquiry-${enquiry._id}">

                        <div class="enquiry-header">
                            <div>
                                <span class="caller">
                                    ${escapeHtml(enquiry.caller)}
                                </span>

                                <span class="status">
                                    ${escapeHtml(status)}
                                </span>
                            </div>

                            <span class="received">
                                Received: ${new Date(enquiry.receivedAt).toLocaleString("en-GB")}
                                ${enquiry.updatedAt
                                ? `<br>Updated: ${new Date(enquiry.updatedAt).toLocaleString("en-GB")}`
                                : ""}
                            </span>
                        </div>

                        <div class="original-message">
                            <span class="original-message-label">Original SMS</span>
                            <p class="message">${escapeHtml(enquiry.message)}</p>
                        </div>

                        <div class="details-grid">

                            <div class="field">
                                <label>Customer Name</label>
                                <input
                                    type="text"
                                    class="customerName"
                                    value="${escapeAttribute(enquiry.customerName || "")}"
                                >
                            </div>

                            <div class="field">
                                <label>Vehicle Registration</label>
                                <input
                                    type="text"
                                    class="vehicleRegistration"
                                    value="${escapeAttribute(enquiry.vehicleRegistration || "")}"
                                >
                            </div>

                            <div class="field">
                                <label>Postcode</label>
                                <input
                                    type="text"
                                    class="postcode"
                                    value="${escapeAttribute(enquiry.postcode || "")}"
                                >
                            </div>

                            <div class="field">
                                <label>Service Required</label>
                                <input
                                    type="text"
                                    class="serviceRequired"
                                    value="${escapeAttribute(enquiry.serviceRequired || "")}"
                                >
                            </div>

                            <div class="field full-width">
                                <label>Notes</label>
                                <textarea class="notes">${escapeHtml(enquiry.notes || "")}</textarea>
                            </div>

                        </div>

                        <div class="card-footer">

                            <div class="status-actions">
                                <label>Status:</label>

                                <select onchange="updateStatus('${enquiry._id}', this.value)">
                                    <option value="New" ${status === "New" ? "selected" : ""}>New</option>
                                    <option value="In Progress" ${status === "In Progress" ? "selected" : ""}>In Progress</option>
                                    <option value="Completed" ${status === "Completed" ? "selected" : ""}>Completed</option>
                                </select>
                            </div>

                            <span class="save-result" id="save-result-${enquiry._id}"></span>

                            <button
                                class="save-button"
                                onclick="saveEnquiry('${enquiry._id}', this)"
                            >
                                Save Details
                            </button>
                            <a href="tel:${enquiry.caller}" class="call-button">
                            📞 Call Customer
                            </a>
                            <button
                                class="copy-button"
                                onclick="copyNumber('${enquiry.caller}', this)"
                            >
                                Copy Number
                            </button>

                        </div>

                    </article>
                `;
            }).join("");
        }

        function setFilter(filter) {
            currentFilter = filter;

            const filteredEnquiries =
                filter === "All"
                    ? allEnquiries
                    : allEnquiries.filter(enquiry =>
                        (enquiry.status || "New") === filter
                    );

            document
                .querySelectorAll(".filters button")
                .forEach(button => {
                    button.classList.toggle(
                        "active",
                        button.dataset.filter === filter
                    );
                });

            renderEnquiries(filteredEnquiries);
        }

        async function copyNumber(number, button) {
    try {
        await navigator.clipboard.writeText(number);

        const originalText = button.textContent;
        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = originalText;
        }, 1500);
    } catch (error) {
        console.error("Unable to copy number:", error);
    }
}

        async function updateStatus(id, status) {
            try {
                const response = await fetch(
                    `/api/enquiries/${id}/status`,
                    {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ status })
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to update status");
                }

                await loadEnquiries();

            } catch (error) {
                alert("Unable to update enquiry status.");
            }
        }

        async function saveEnquiry(id, button) {
            const card = document.getElementById(`enquiry-${id}`);
            const result = document.getElementById(`save-result-${id}`);

            const details = {
                customerName: card.querySelector(".customerName").value.trim(),
                vehicleRegistration: card.querySelector(".vehicleRegistration").value.trim(),
                postcode: card.querySelector(".postcode").value.trim(),
                serviceRequired: card.querySelector(".serviceRequired").value.trim(),
                notes: card.querySelector(".notes").value.trim()
            };

            button.disabled = true;
            button.textContent = "Saving...";
            result.textContent = "";

            try {
                const response = await fetch(
                    `/api/enquiries/${id}`,
                    {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(details)
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to save enquiry");
                }

                result.textContent = "Saved";

                await loadEnquiries();

            } catch (error) {
                result.textContent = "Save failed";
                button.disabled = false;
                button.textContent = "Save Details";
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value);
        }

        loadEnquiries();
    </script>

</body>
</html>
