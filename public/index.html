<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MissedCall Rescue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 30px;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            color: #cbd5e1;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .dashboard-heading h2 {
            margin: 0;
            font-size: 22px;
        }

        #enquiry-count {
            background: #e5e7eb;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .enquiry-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .enquiry-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 14px;
        }

        .caller {
            font-weight: bold;
            font-size: 17px;
        }

        .received {
            color: #6b7280;
            font-size: 13px;
            white-space: nowrap;
        }

        .message {
            margin: 0;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty,
        .error {
            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            .enquiry-header {
                display: block;
            }

            .received {
                display: block;
                margin-top: 6px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>MissedCall Rescue</h1>
            <p>Enquiry Dashboard</p>
        </div>
    </header>

    <main>
        <div class="dashboard-heading">
            <h2>Enquiries</h2>
            <span id="enquiry-count">Loading...</span>
        </div>

        <div id="enquiries">
            <div class="empty">Loading enquiries...</div>
        </div>
    </main>

    <script>
        async function loadEnquiries() {
            const container = document.getElementById("enquiries");
            const count = document.getElementById("enquiry-count");

            try {
                const response = await fetch("/api/enquiries");

                if (!response.ok) {
                    throw new Error("Unable to retrieve enquiries");
                }

                const enquiries = await response.json();

                count.textContent =
                    `${enquiries.length} ${enquiries.length === 1 ? "enquiry" : "enquiries"}`;

                if (enquiries.length === 0) {
                    container.innerHTML =
                        '<div class="empty">No enquiries yet.</div>';
                    return;
                }

                container.innerHTML = enquiries.map(enquiry => `
                    <article class="enquiry-card">
                        <div class="enquiry-header">
                            <span class="caller">${escapeHtml(enquiry.caller)}</span>
                            <span class="received">
                                ${new Date(enquiry.receivedAt).toLocaleString("en-GB")}
                            </span>
                        </div>

                        <p class="message">${escapeHtml(enquiry.message)}</p>
                    </article>
                `).join("");

            } catch (error) {
                count.textContent = "Error";
                container.innerHTML =
                    '<div class="error">Unable to load enquiries.</div>';
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        loadEnquiries();
    </script>

</body>
</html>
